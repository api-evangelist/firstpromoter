    - https://api.firstpromoter.com/api/admin/v1
  policy_published: false
  note: >-
    v1 existed and is referenced by name throughout the docs and by abandoned third-party SDKs, but
    the v1 OpenAPI documents indexed in llms.txt (openapi-promoters, openapi-payouts,
    openapi-reports, openapi-rewards, openapi-tracking, openapi-leads) all 404 as of 2026-08-13 -
    the index still advertises contracts that are no longer served. One current spec, custom
    referral statuses, still serves from /api/admin/v1 while everything else is on /api/v2.
