maturity_signals:
  - signal: MCP server declared experimental by the provider
    detail: "The FirstPromoter MCP server is experimental. The tool surface and authentication flow may change without notice."
  - signal: llms.txt advertises six 404 contracts
    detail: The docs index is not reconciled against what the docs host actually serves.
  - signal: duplicate operationId in a published spec
    detail: >-
      POST /promoters/accept and POST /promoters/assign_parent both carry operationId
      acceptPromoters in firstpromoter-v2-promoters-openapi.yml, which breaks code generation.
  - signal: invalid JSON in a published spec
    detail: >-
      openapi-v2-referrals.json is served with a trailing comma before the end of an array
      (line 142) and does not parse with a strict JSON parser. The copy in this repository has that
      single comma removed so it is machine-readable; the defect is in the provider's published file.
