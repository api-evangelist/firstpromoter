  - group: Affiliate-facing API (api/v2/affiliate)
    operations:
      - 46 operations across 13 affiliate-scope specs
    reason: >-
      The MCP server is scoped to the admin/company surface. The affiliate-facing API, which a
      promoter's own session calls, has no MCP tools.
  - group: Batch process tracking
    operations:
      - listBatchProcesses
      - getBatchProcess
      - getBatchProcessProgress
