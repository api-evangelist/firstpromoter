notes:
  - >-
    Tool names and descriptions are transcribed from the provider's published reference. Tool
    inputSchemas are NOT recorded - they require an authenticated tools/list call against the
    OAuth-gated endpoint.
  - >-
    A second, unrelated MCP manifest is served at
    https://docs.firstpromoter.com/.well-known/mcp.json pointing at a Mintlify preview host
    (firstpromoter.main-kill-isr.mintlify.me). That is the documentation-search MCP emitted by the
    docs platform, not the FirstPromoter product MCP server, and it is not treated as an agent
    surface for FirstPromoter.
