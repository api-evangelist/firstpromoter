aid: firstpromoter
name: FirstPromoter
description: FirstPromoter is an affiliate, referral and influencer marketing platform for SaaS and subscription
  businesses, run by Igil Web SRL since 2016. It tracks clicks, leads and sales, manages promoters and campaigns,
  calculates multi-tier commissions and rewards, and pays affiliates through PayPal, Wise, Stripe and managed payouts.
  The public v2 REST API spans 37 first-party OpenAPI definitions and 179 operations across an admin surface, a
  promoter-facing surface and a server-side tracking surface, alongside a 44-event webhooks v2 system, a browser
  tracking library, and a remote MCP server for AI clients.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
