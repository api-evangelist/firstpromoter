    count: 170
    meaning: >-
      Missing or invalid bearer token. FirstPromoter requires BOTH an Authorization: Bearer header
      and an ACCOUNT-ID header; omitting the account header is a common cause.
    remediation: >-
      Re-check the API key from Settings - Integrations - Manage API Keys, and confirm the
